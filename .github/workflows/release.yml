name: Release

# Builds and publishes a release when a version tag is pushed. A tag arrives
# together with the commit it names, so the archives attached to a release are
# built here, from that commit, and each one carries a signed build provenance
# attestation that ties it to this repository and this workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its archives
      id-token: write      # sign the provenance attestation
      attestations: write  # store it with this repository
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # The toolchain line comes from go.mod. Only its major.minor is kept, and
      # check-latest resolves the newest patch of that line, because Go ships
      # standard library security fixes in patch releases.
      - name: Read the Go version from go.mod
        id: go
        run: echo "version=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]}' go.mod)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Release notes from CHANGELOG.md
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      # Creates the release as a draft (see .goreleaser.yml), which nobody
      # outside the repository can see yet. The GoReleaser version is the one
      # in .tool-versions, so the tool that builds the archives is named by the
      # tagged commit.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version-file: .tool-versions
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Published only once every archive has its attestation, so a visible
      # release never lacks one. If any step above failed, the draft stays
      # hidden and the fix ships as a new version.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
